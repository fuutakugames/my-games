<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Googleなどの検索結果に出にくくする設定 -->
  <meta name="robots" content="noindex, nofollow">
  <title>マイゲームポータル</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #222;
      padding: 20px 16px 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    .count {
      font-size: 0.9rem;
      color: #666;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: #ffffff;
      border-radius: 14px;
      padding: 18px 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .card:active {
      transform: scale(0.96);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    .icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
      line-height: 1;
    }
    .title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .desc {
      font-size: 0.78rem;
      color: #666;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 マイゲームポータル</h1>
    <p class="count" id="game-count">ゲーム読み込み中...</p>
  </header>

  <main class="grid" id="game-list">

    <!-- ================================================= -->
    <!-- ★ここから下に新しいゲームのカードを追加します★ -->
    <!-- ================================================= -->

    <!-- 1つ目の見本（最初のゲームを入れたら書き換えてください） -->
    <a class="card" href="games/sample.html">
      <div class="icon">🎲</div>
      <div class="title">サンプルゲーム</div>
      <div class="desc">ここに説明が入ります</div>
    </a>

    <!--
    【追加用テンプレート：下の5行をコピーして上に貼り付けて使います】
    <a class="card" href="games/ファイル名.html">
      <div class="icon">🚀</div>
      <div class="title">ゲーム名</div>
      <div class="desc">ひとこと説明</div>
    </a>
    -->

  </main>

  <script>
    // 登録されているゲーム数を自動で数えて表示します
    const total = document.querySelectorAll('#game-list .card').length;
    document.getElementById('game-count').textContent = `全 ${total} 本のゲーム`;
  </script>

</body>
</html>
